# Publishes tweets from the tweets/ folder when they land on main and
# previews them on pull requests.
#
# All actions are pinned to commit hashes; the comment holds the tag.
# Bump the hash and the comment together.
name: Twitter, together!

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main

permissions: {}

env:
  # the posting account, used by the preview to check X's reply / quote rule
  TWITTER_ACCOUNT: eth_classic

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate Tweets
        uses: IstoraMandiri/twitter-together@9de0289ebcd165250388315b63b2bae4f8eebe40 # fix/x-com-urls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tweet:
    name: Tweet
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write # commit comments with the tweet URLs / errors
    steps:
      - name: checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tweet
        uses: IstoraMandiri/twitter-together@9de0289ebcd165250388315b63b2bae4f8eebe40 # fix/x-com-urls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET_KEY: ${{ secrets.TWITTER_API_SECRET_KEY }}
