# Publishes tweets whose `schedule` front matter time has passed.
#
# A tweet with a schedule is deliberately NOT published when its pull request
# is merged. It is queued in .github/published-tweets.json and published by
# this workflow, which runs only when asked to:
#
#   - by the contributions app (https://etc.contributions.app), whose half-hourly
#     cron checks the queue and sends a "publish-scheduled-tweets" dispatch
#     event when something is due, so there are no empty runs here;
#   - by a maintainer with the "Run workflow" button, to publish due tweets
#     without waiting for the next check.
#
# This needs no credentials beyond the ones already configured for tweeting.
#
# Whether a tweet has been sent is recorded as a check run on the commit that
# added its file. Only a GitHub App (this workflow's token) can create or
# change check runs and nobody can delete them, so a record can neither be
# forged to suppress a tweet nor removed to have it sent again. A record is
# created before the tweet is sent, so an interrupted run can never publish
# the same tweet twice. To retry a tweet X rejected, push a change to its
# file.
#
# The queue of what is waiting, .github/published-tweets.json, lives on the
# "published-tweets" branch (created automatically) because main only accepts
# pull requests. It is only an index for the contributions app to read.
#
# All actions are pinned to commit hashes; the comment holds the ref.
name: Publish scheduled tweets

on:
  repository_dispatch:
    types:
      - publish-scheduled-tweets
  workflow_dispatch:

permissions: {}

# never let two runs publish at the same time
concurrency:
  group: publish-scheduled-tweets
  cancel-in-progress: false

jobs:
  publish:
    name: Publish due tweets
    runs-on: ubuntu-latest
    permissions:
      contents: write # the queue on the published-tweets branch
      checks: write # publication records
    steps:
      - name: checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # records attach to the commit that added each tweet
      - name: Publish
        uses: IstoraMandiri/twitter-together@9de0289ebcd165250388315b63b2bae4f8eebe40 # fix/x-com-urls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET_KEY: ${{ secrets.TWITTER_API_SECRET_KEY }}
